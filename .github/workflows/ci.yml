name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # svelte-check ainda tem erros pre-existentes; roda como informativo
      - name: Type check (informativo)
        run: npm run check
        continue-on-error: true

      - name: Build
        run: npm run build

  version:
    name: Version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verifica se a versao ja foi publicada
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Pacote: $NAME@$VERSION"
          if [ -n "$(npm view "$NAME@$VERSION" version --silent 2>/dev/null || true)" ]; then
            echo "::error::A versao $VERSION ja existe no npm. Rode 'npm version patch|minor|major' neste PR antes do merge."
            exit 1
          fi
          echo "Versao $VERSION esta livre — o merge em main vai publicar."
